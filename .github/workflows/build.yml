name: Build H3 Flex worker
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: h3-flex-image-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Validate wrapper
        run: python3 -m unittest -v test_handler
      - name: Determine image name
        shell: bash
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/h3-flex" >> "$GITHUB_ENV"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and publish software image (no weights)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runpod
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:1.0
            ${{ env.IMAGE }}:sha-${{ github.sha }}
