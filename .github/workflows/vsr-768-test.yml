name: Build H3 RelayVSR 768p test
on:
  push:
    branches: [vsr-768-combo]
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest test_vsr_worker
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.vsr-768-test
          platforms: linux/amd64
          push: true
          tags: ghcr.io/wlekin/h3-flex:vsr-768-combo-1











