name: Build H3 resident worker
on:
  push:
    branches: [resident-worker]
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest test_signed_input_worker test_resident_worker test_handler
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.resident
          platforms: linux/amd64
          push: true
          tags: ghcr.io/wlekin/h3-flex:resident-worker-1





